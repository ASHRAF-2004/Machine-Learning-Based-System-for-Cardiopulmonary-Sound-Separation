# Production/local-real-provider overlay. The ADC file remains on the host,
# outside the repository and image, and is mounted read-only.
services:
  api:
    environment:
      STETHOFUSE_FIREBASE_ENABLED: "1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-adc.json
    volumes:
      - type: bind
        source: ${STETHOFUSE_ADC_FILE:?Set STETHOFUSE_ADC_FILE to an external ADC JSON file}
        target: /run/secrets/firebase-adc.json
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); assert data.get('storage_configured') and data.get('provider_configured')
      interval: 30s
      timeout: 4s
      start_period: 35s
      retries: 3
